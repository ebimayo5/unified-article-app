<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アーコン APIキー管理</title>
  <style>
    body {font: 16px system-ui,sans-serif; color:#17352a; background:#edf5f0; margin:0; padding:20px}
    main {max-width:540px; margin:auto; background:white; border-radius:16px; padding:24px; box-shadow:0 8px 30px #17352a18}
    h1 {font-size:22px; margin:0 0 10px} p {line-height:1.6}
    label {display:block; font-weight:700; margin:18px 0 6px}
    input {box-sizing:border-box; width:100%; font:inherit; padding:12px; border:1px solid #98b9a8; border-radius:8px}
    button {font:inherit; font-weight:700; border:0; border-radius:8px; padding:12px 16px; background:#08754e; color:white; margin-top:16px}
    button:disabled {opacity:.5} .muted {color:#52685d;font-size:14px} .error {color:#a32222}
  </style>
</head>
<body><main>
  <h1>APIキー管理</h1>
  <p class="muted">所有者のGoogleアカウントだけが利用できます。変更には登録メール宛ての確認コードが必要です。</p>
  <p id="status" role="status">状態を確認中…</p>
  <label for="key">SerpApi APIキー</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="新しいキーを入力">
  <button id="send" type="button">確認コードをメールで受け取る</button>
  <label for="code">確認コード</label>
  <input id="code" type="text" inputmode="text" maxlength="10" autocomplete="one-time-code" autocapitalize="characters" placeholder="10文字・5分間有効">
  <button id="save" type="button">APIキーを保存</button>
  <p id="notice" role="alert"></p>
</main>
<script>
  const status = document.getElementById('status');
  const notice = document.getElementById('notice');
  const send = document.getElementById('send');
  const save = document.getElementById('save');
  function fail(error) {
    send.disabled = save.disabled = false;
    notice.className = 'error';
    notice.textContent = error && error.message ? error.message : '操作に失敗しました。';
  }
  google.script.run.withSuccessHandler(function(result) {
    status.textContent = result.configured ? 'SerpApi: 設定済み（末尾 ' + result.suffix + '）' : 'SerpApi: 未設定';
  }).withFailureHandler(function(error) {
    status.textContent = '状態を取得できません'; fail(error);
  }).uaAdminSerpApiStatus();
  send.addEventListener('click', function() {
    notice.textContent = ''; send.disabled = true;
    google.script.run.withSuccessHandler(function() {
      notice.className = ''; notice.textContent = '確認コードを所有者のメールへ送りました。';
      send.disabled = false;
    }).withFailureHandler(fail).uaAdminRequestSerpApiCode();
  });
  save.addEventListener('click', function() {
    notice.textContent = ''; save.disabled = true;
    google.script.run.withSuccessHandler(function(result) {
      document.getElementById('key').value = '';
      document.getElementById('code').value = '';
      status.textContent = 'SerpApi: 設定済み（末尾 ' + result.suffix + '）';
      notice.className = ''; notice.textContent = 'APIキーを保存しました。';
      save.disabled = false;
    }).withFailureHandler(fail).uaAdminSaveSerpApiKey(
      document.getElementById('key').value, document.getElementById('code').value);
  });
</script>
</body></html>
