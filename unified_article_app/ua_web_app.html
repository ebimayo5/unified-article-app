<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #f2fbf7;
        --panel: #ffffff;
        --line: #cce7db;
        --text: #1f2933;
        --muted: #667085;
        --brand: #20ad7f;
        --brand-dark: #0d7659;
        --soft: #e5f7ee;
        --soft-strong: #c9ebd9;
        --danger: #b42318;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        font-size: 14px;
      }

      .app { min-height: 100vh; display: grid; grid-template-columns: 320px 1fr; }
      .sidebar { border-right: 1px solid var(--line); background: #f7fdf9; min-height: 100vh; padding: 16px; position: sticky; top: 0; }
      .main { min-width: 0; padding: 16px 20px 28px; }
      .topbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 12px 0 14px; background: var(--bg); }
      h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; }
      h2 { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--soft); color: var(--brand-dark); font-size: 16px; }
      label { display: block; margin: 10px 0 5px; color: #344054; font-weight: 700; }
      input, textarea, select { width: 100%; border: 1px solid #cbd5df; border-radius: 7px; padding: 9px; background: #fff; color: var(--text); font: inherit; }
      textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
      input, select { min-height: 38px; }
      button { border: 1px solid transparent; border-radius: 7px; padding: 9px 12px; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: 0.58; cursor: default; }
      .primary { color: #fff; background: var(--brand); }
      .secondary { color: var(--brand-dark); background: var(--soft-strong); border-color: #9bd8bf; }
      .neutral { color: var(--brand-dark); background: #d9f2e5; border-color: #8bcfac; }
      .danger { color: #fff; background: var(--danger); }
      .card { margin-bottom: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04); }
      .status { min-width: 270px; padding: 10px 12px; border: 1px solid #c9e4dd; border-radius: 7px; background: var(--soft); color: var(--brand-dark); font-size: 15px; font-weight: 800; }
      .status.working { color: #fff; background: var(--brand); border-color: var(--brand); animation: pulseStatus 1.1s ease-in-out infinite; }
      .status.error { color: var(--danger); border-color: #fecdca; background: #fff1f0; }
      .progress { height: 7px; margin-top: 8px; border-radius: 999px; overflow: hidden; background: #dfe7e5; }
      .progress-bar { width: 0%; height: 100%; border-radius: 999px; background: var(--brand); transition: width 0.25s ease; }
      .progress-bar.loading { width: 38%; animation: progressMove 1.2s ease-in-out infinite; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .main-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
      .url-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
      .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 5px; }
      .field-head label { margin: 0; }
      .copy-button { padding: 5px 9px; color: var(--brand-dark); background: #d9f2e5; border-color: #8bcfac; font-size: 12px; }
      .candidate-list { display: grid; gap: 7px; max-height: calc(100vh - 260px); overflow: auto; padding-right: 2px; }
      .candidate { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 9px; }
      .candidate:hover { border-color: var(--brand); background: var(--soft); }
      .candidate.sent { color: #777; background: #eeeeee; }
      .candidate-title { font-weight: 800; line-height: 1.35; }
      .candidate-meta { display: flex; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 12px; }
      .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
      .tab { color: var(--brand-dark); background: var(--soft); border-color: var(--line); }
      .tab.active { color: #fff; background: var(--brand); border-color: var(--brand); }
      .body-preview { min-height: 340px; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
      .check-preview { min-height: 120px; }
      .structure-preview { min-height: 360px; }
      .main-input { min-height: 104px; }
      .notes-input { min-height: 104px; }
      .small-textarea { min-height: 64px; }
      .hidden { display: none; }
      .theme-brown { --brand: #8a5a32; --brand-dark: #5f3b1f; --soft: #f8ead6; --soft-strong: #f1d9b8; }
      .theme-blue { --brand: #2563eb; --brand-dark: #1746a2; --soft: #e5f1fb; --soft-strong: #d8e9fb; }

      @keyframes pulseStatus { 0% { opacity: 0.82; } 50% { opacity: 1; } 100% { opacity: 0.82; } }
      @keyframes progressMove { 0% { transform: translateX(-130%); } 50% { transform: translateX(85%); } 100% { transform: translateX(250%); } }
      @media (max-width: 980px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { position: static; min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        .candidate-list { max-height: 360px; }
        .actions { grid-template-columns: 1fr 1fr; }
        .main-grid, .url-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <h1>記事作成アプリ</h1>
        <div class="card">
          <label for="appType">サイト / 記事タイプ</label>
          <select id="appType" onchange="onAppTypeChange()"></select>

          <div id="candidateControls">
            <div class="actions" style="grid-template-columns:1fr; margin-top:10px;">
              <button class="primary" type="button" onclick="openCandidateSheet(this)">候補シートをスプシで開く</button>
              <button class="secondary" type="button" onclick="createFromActiveCandidate(this)">スプシの選択行を反映</button>
            </div>
            <label for="candidateRow">候補シートの行番号で反映</label>
            <div class="row">
              <input id="candidateRow" placeholder="例: 25">
              <button class="neutral" type="button" onclick="createFromCandidateRow(this)">行番号を反映</button>
            </div>
          </div>

          <button class="secondary" type="button" style="width:100%; margin-top:10px;" onclick="createBlankArticle(this)">新規記事行を作る</button>

          <div class="row">
            <div>
              <label for="articleProvider">本文API</label>
              <select id="articleProvider" onchange="saveProviders()"></select>
            </div>
            <div>
              <label for="readerMindProvider">心理API</label>
              <select id="readerMindProvider" onchange="saveProviders()"></select>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <h1>記事編集</h1>
            <div id="subText" class="muted">候補を選ぶと、ここに編集フォームが入ります。</div>
          </div>
          <div>
            <div id="notice" class="status">読み込み中...</div>
            <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
          </div>
        </div>

        <div class="main-grid">
          <div class="card">
            <h2>基本情報</h2>
            <div class="row">
              <div><label for="row">記事行</label><input id="row" readonly></div>
              <div><label for="status">状態</label><input id="status"></div>
            </div>
            <label id="mainInputLabel" for="mainInput">メインキーワード / 案件指示書</label>
            <textarea id="mainInput" class="main-input"></textarea>
            <div class="row">
              <div><label for="volume">検索ボリューム</label><input id="volume"></div>
              <div><label for="generationModel">使用モデル</label><input id="generationModel" readonly></div>
            </div>
          </div>

          <div class="card">
            <h2>案件・競合</h2>
            <div class="row">
              <div><label for="affiliateName">メイン案件名</label><input id="affiliateName"></div>
              <div><label for="affiliateUrl">メインアフィリエイトURL</label><input id="affiliateUrl" placeholder="https://..."></div>
            </div>
            <label for="affiliateNotes">案件注意点 / その他制約事項</label>
            <textarea id="affiliateNotes" class="notes-input"></textarea>
            <div class="url-grid">
              <div><label for="competitorUrl1">競合URL1</label><input id="competitorUrl1" placeholder="https://..."></div>
              <div><label for="competitorUrl2">競合URL2</label><input id="competitorUrl2" placeholder="https://..."></div>
              <div><label for="competitorUrl3">競合URL3</label><input id="competitorUrl3" placeholder="https://..."></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="field-head">
            <h2>読者心理メモ</h2>
            <button class="copy-button" type="button" onclick="copyField('readerMindMemo', '読者心理メモ')">コピー</button>
          </div>
          <textarea id="readerMindMemo"></textarea>
          <div class="actions">
            <button class="secondary" onclick="runReaderMind(this)">読者心理メモを取得</button>
            <button class="primary" onclick="runArticle(this)">本文生成</button>
            <button class="neutral" onclick="saveArticle(this)">保存</button>
            <button id="wpDraftButton" class="secondary" onclick="createWpDraft(this)">WP下書き作成</button>
          </div>
          <div class="actions" style="grid-template-columns:1fr; margin-top:8px;">
            <button class="neutral" onclick="markPosted(this)">投稿済みにする</button>
          </div>
        </div>

        <div class="card">
          <div class="tabs">
            <button id="tabSummary" class="tab active" onclick="showTab('summary')">概要</button>
            <button id="tabBody" class="tab" onclick="showTab('body')">本文</button>
            <button id="tabCheck" class="tab" onclick="showTab('check')">確認</button>
          </div>

          <div id="panelSummary">
            <div class="field-head"><label for="titleIdeas">タイトル案</label><button class="copy-button" type="button" onclick="copyField('titleIdeas', 'タイトル案')">コピー</button></div>
            <textarea id="titleIdeas"></textarea>
            <div class="field-head"><label for="metaDescription">メタディスクリプション</label><button class="copy-button" type="button" onclick="copyField('metaDescription', 'メタディスクリプション')">コピー</button></div>
            <textarea id="metaDescription"></textarea>
            <div class="field-head"><label for="permalink">パーマリンク</label><button class="copy-button" type="button" onclick="copyField('permalink', 'パーマリンク')">コピー</button></div>
            <input id="permalink">
            <div class="field-head"><label for="tags">関連タグ</label><button class="copy-button" type="button" onclick="copyField('tags', '関連タグ')">コピー</button></div>
            <textarea id="tags" class="small-textarea"></textarea>
            <div id="wpSummaryBlock">
              <div class="row">
                <div><label for="wpPostId">WP投稿ID</label><input id="wpPostId" readonly></div>
                <div><label for="wpDraftedAt">WP入稿日時</label><input id="wpDraftedAt" readonly></div>
              </div>
              <div class="field-head"><label for="wpEditUrl">WP編集URL</label><button class="copy-button" type="button" onclick="copyField('wpEditUrl', 'WP編集URL')">コピー</button></div>
              <input id="wpEditUrl" readonly>
            </div>
          </div>

          <div id="panelBody" class="hidden">
            <div class="field-head"><label for="body">本文</label><button class="copy-button" type="button" onclick="copyField('body', '本文')">コピー</button></div>
            <textarea id="body" class="body-preview"></textarea>
          </div>

          <div id="panelCheck" class="hidden">
            <div class="field-head"><label for="factCheckPoints">要確認ポイント</label><button class="copy-button" type="button" onclick="copyField('factCheckPoints', '要確認ポイント')">コピー</button></div>
            <textarea id="factCheckPoints" class="body-preview check-preview"></textarea>
            <div class="field-head"><label for="structureMemo">構成メモ</label><button class="copy-button" type="button" onclick="copyField('structureMemo', '構成メモ')">コピー</button></div>
            <textarea id="structureMemo" class="body-preview structure-preview"></textarea>
          </div>
        </div>
      </main>
    </div>

    <script>
      const fields = ['row','mainInput','volume','affiliateName','affiliateUrl','affiliateNotes','competitorUrl1','competitorUrl2','competitorUrl3','readerMindMemo','status','generationModel','body','titleIdeas','tags','metaDescription','permalink','factCheckPoints','structureMemo','wpPostId','wpEditUrl','wpDraftedAt'];
      let appConfigs = [];
      let articleProviders = [];
      let readerMindProviders = [];
      let activeButton = null;
      let activeButtonText = '';

      function init() {
        setBusy('アプリを読み込み中...');
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          appConfigs = data.appConfigs || [];
          articleProviders = data.articleProviders || [];
          readerMindProviders = data.readerMindProviders || [];
          fillSelect('appType', appConfigs.map(function(item) { return { value: item.label, label: item.label }; }), appConfigs[0] && appConfigs[0].label);
          fillSelect('articleProvider', articleProviders, data.selectedArticleProvider || 'openai');
          fillSelect('readerMindProvider', readerMindProviders, data.selectedReaderMindProvider || 'gemini');
          applyTheme();
          setProgress('done');
          setNotice('候補シートを開くか、行番号で記事行を呼び出してください。', false);
        }).withFailureHandler(fail).uaGetWebAppBootData();
      }

      function fillSelect(id, options, selectedValue) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        (options || []).forEach(function(item) {
          const option = document.createElement('option');
          option.value = item.value;
          option.textContent = item.label;
          if (item.value === selectedValue) option.selected = true;
          select.appendChild(option);
        });
      }

      function onAppTypeChange() { applyTheme(); }

      function applyTheme() {
        const config = currentConfig();
        const app = document.getElementById('app');
        app.classList.remove('theme-brown', 'theme-blue');
        if (config && config.theme === 'brown') app.classList.add('theme-brown');
        if (config && config.theme === 'blue') app.classList.add('theme-blue');
        document.getElementById('mainInputLabel').textContent = config && config.inputLabel ? config.inputLabel : 'メインキーワード / 案件指示書';
        updateCandidateVisibility(config);
        updateWpVisibility(config);
      }

      function updateCandidateVisibility(config) {
        const candidateControls = document.getElementById('candidateControls');
        const isDisabled = !config || !config.candidateSheetName;
        if (candidateControls) candidateControls.classList.toggle('hidden', isDisabled);
      }

      function updateWpVisibility(config) {
        const isDisabled = config && config.useWordPress === false;
        const wpButton = document.getElementById('wpDraftButton');
        const wpSummaryBlock = document.getElementById('wpSummaryBlock');
        if (wpButton) wpButton.classList.toggle('hidden', isDisabled);
        if (wpSummaryBlock) wpSummaryBlock.classList.toggle('hidden', isDisabled);
      }

      function currentConfig() {
        const selected = document.getElementById('appType').value;
        return appConfigs.find(function(item) { return item.label === selected; });
      }

      function openCandidateSheet(button) {
        setBusy('候補シートを開いています...', button);
        google.script.run.withSuccessHandler(function(result) {
          clearBusy();
          setProgress('done');
          if (result && result.url) window.open(result.url, '_blank');
          setNotice(result && result.message ? result.message : '候補シートを開きました。', false);
        }).withFailureHandler(fail).uaGetCandidateSheetUrlForWeb(document.getElementById('appType').value);
      }

      function createFromActiveCandidate(button) {
        setBusy('スプシの選択行を反映中...', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice(data && data.message ? data.message : 'スプシの選択行を反映しました。', false);
        }).withFailureHandler(fail).uaCreateArticleFromActiveCandidateForWeb(document.getElementById('appType').value);
      }

      function createFromCandidateRow(button) {
        const row = Number(document.getElementById('candidateRow').value);
        if (!row || row <= 1) { setNotice('候補シートの行番号を入力してください。', true); return; }
        setBusy('行番号から反映中...', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice(data && data.message ? data.message : '行番号から反映しました。', false);
        }).withFailureHandler(fail).uaCreateArticleFromCandidateForWeb(document.getElementById('appType').value, row);
      }

      function createBlankArticle(button) {
        setBusy('新規記事行を作成中...', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice(data && data.message ? data.message : '新規記事行を作成しました。', false);
        }).withFailureHandler(fail).uaCreateBlankArticleForWeb(document.getElementById('appType').value);
      }

      function readForm() {
        const data = { appType: document.getElementById('appType').value };
        fields.forEach(function(id) { const el = document.getElementById(id); if (el) data[id] = el.value; });
        return data;
      }

      function fillForm(data) {
        data = data || {};
        if (data.appType) document.getElementById('appType').value = data.appType;
        fields.forEach(function(id) { const el = document.getElementById(id); if (el) el.value = data[id] || ''; });
        applyTheme();
        document.getElementById('subText').textContent = data.mainInput ? data.mainInput : '候補を選ぶと、ここに編集フォームが入ります。';
      }

      function saveArticle(button) {
        setBusy('保存中...', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice('保存しました。', false);
        }).withFailureHandler(fail).uaSaveActiveRowData(readForm());
      }

      function runReaderMind(button) {
        setBusy('読者心理メモを取得中...', button);
        const slowTimer = setTimeout(function() {
          setNotice('読者心理メモの取得に時間がかかっています。原因候補は、Q&Aサイト側の混雑・一時的なブロック・検索結果ページの応答遅延・AI側の混雑です。このまま待つか、時間を置いてページを再読み込みしてからリトライしてください。', true);
        }, 60000);
        google.script.run.withSuccessHandler(function(data) {
          clearTimeout(slowTimer);
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice(data.message || '読者心理メモを作成しました。', false);
        }).withFailureHandler(function(error) { clearTimeout(slowTimer); fail(error); }).uaRunReaderMindMemoFromWeb(readForm());
      }

      function runArticle(button) {
        setBusy('本文生成中... 少し時間がかかります', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          showTab('body');
          setProgress('done');
          setNotice(data.message || '本文生成が完了しました。', false);
        }).withFailureHandler(fail).uaRunArticleFromWeb(readForm());
      }

      function markPosted(button) {
        setBusy('投稿済みに更新中...', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice(data.message || '投稿済みにしました。', false);
        }).withFailureHandler(fail).uaMarkArticlePostedFromWeb(readForm());
      }

      function createWpDraft(button) {
        setBusy('WordPress下書き作成中...', button);
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          fillForm(data);
          setProgress('done');
          setNotice(data.message || 'WordPress下書きを作成しました。', false);
        }).withFailureHandler(fail).uaCreateWpDraftFromWeb(readForm());
      }

      function saveProviders() {
        setBusy('使用APIを更新中...');
        google.script.run.withSuccessHandler(function(result) {
          clearBusy();
          setProgress('done');
          setNotice(result.message || '使用APIを更新しました。', false);
        }).withFailureHandler(fail).uaSetProvidersFromPanel(document.getElementById('articleProvider').value, document.getElementById('readerMindProvider').value);
      }

      function showTab(name) {
        ['summary', 'body', 'check'].forEach(function(tab) {
          document.getElementById('panel' + capitalize(tab)).classList.toggle('hidden', tab !== name);
          document.getElementById('tab' + capitalize(tab)).classList.toggle('active', tab === name);
        });
      }

      function capitalize(value) { return value.charAt(0).toUpperCase() + value.slice(1); }

      function copyField(id, label) {
        const el = document.getElementById(id);
        const text = el ? el.value : '';
        if (!text) { setNotice((label || '項目') + 'は空です。', true); return; }
        navigator.clipboard.writeText(text).then(function() {
          setNotice((label || '項目') + 'をコピーしました。', false);
        }).catch(function() {
          const temp = document.createElement('textarea');
          temp.value = text;
          temp.style.position = 'fixed';
          temp.style.left = '-9999px';
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          setNotice((label || '項目') + 'をコピーしました。', false);
        });
      }

      function setNotice(message, isError) {
        const notice = document.getElementById('notice');
        notice.textContent = message;
        notice.className = isError ? 'status error' : 'status';
      }

      function setBusy(message, button) {
        setNotice(message, false);
        document.getElementById('notice').className = 'status working';
        setProgress('loading');
        activeButton = button || null;
        activeButtonText = activeButton ? activeButton.textContent : '';
        document.querySelectorAll('button').forEach(function(item) { item.disabled = true; });
        if (activeButton) activeButton.textContent = message;
      }

      function clearBusy() {
        document.querySelectorAll('button').forEach(function(item) { item.disabled = false; });
        if (activeButton) activeButton.textContent = activeButtonText;
        activeButton = null;
        activeButtonText = '';
      }

      function setProgress(state) {
        const bar = document.getElementById('progressBar');
        bar.className = 'progress-bar';
        bar.style.background = 'var(--brand)';
        if (state === 'loading') { bar.classList.add('loading'); bar.style.width = '38%'; return; }
        if (state === 'done') { bar.style.width = '100%'; return; }
        if (state === 'error') { bar.style.width = '100%'; bar.style.background = 'var(--danger)'; return; }
        bar.style.width = '0%';
      }

      function fail(error) {
        clearBusy();
        setProgress('error');
        setNotice('処理に失敗しました: ' + (error && error.message ? error.message : error), true);
      }

      init();
    </script>
  </body>
</html>
