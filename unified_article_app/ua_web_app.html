<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #f2fbf7;
        --panel: #ffffff;
        --line: #cce7db;
        --text: #1f2933;
        --muted: #667085;
        --brand: #20ad7f;
        --brand-dark: #0d7659;
        --soft: #e5f7ee;
        --soft-strong: #c9ebd9;
        --danger: #b42318;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        font-size: 14px;
      }

      .app { min-height: 100vh; display: grid; grid-template-columns: 320px 1fr; }
      .sidebar { border-right: 1px solid var(--line); background: #f7fdf9; min-height: 100vh; padding: 16px; position: sticky; top: 0; }
      .main { min-width: 0; padding: 16px 20px 28px; }
      .topbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 12px 0 14px; background: var(--bg); }
      h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; }
      h2 { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--soft); color: var(--brand-dark); font-size: 16px; }
      label { display: block; margin: 10px 0 5px; color: #344054; font-weight: 700; }
      input, textarea, select { width: 100%; border: 1px solid #cbd5df; border-radius: 7px; padding: 9px; background: #fff; color: var(--text); font: inherit; }
      textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
      input, select { min-height: 38px; }
      button { border: 1px solid transparent; border-radius: 7px; padding: 9px 12px; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: 0.58; cursor: default; }
      .primary { color: #fff; background: var(--brand); }
      .secondary { color: var(--brand-dark); background: #e4f4ef; border-color: #95cfc2; }
      .neutral { color: var(--brand-dark); background: #f3faf7; border-color: #badbd2; }
      .danger { color: #fff; background: var(--danger); }
      .card { margin-bottom: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04); }
      .status { min-width: 270px; padding: 10px 12px; border: 1px solid #c9e4dd; border-radius: 7px; background: var(--soft); color: var(--brand-dark); font-size: 15px; font-weight: 800; }
      .status.working { color: #fff; background: var(--brand); border-color: var(--brand); animation: pulseStatus 1.1s ease-in-out infinite; }
      .status.error { color: var(--danger); border-color: #fecdca; background: #fff1f0; }
      .progress { height: 7px; margin-top: 8px; border-radius: 999px; overflow: hidden; background: #dfe7e5; }
      .progress-bar { width: 0%; height: 100%; border-radius: 999px; background: var(--brand); transition: width 0.25s ease; }
      .progress-bar.loading { width: 38%; animation: progressMove 1.2s ease-in-out infinite; }
      .modal-backdrop { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15, 23, 42, 0.42); }
      .modal { width: min(560px, 100%); border: 1px solid #b8ded6; border-radius: 10px; background: #fff; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22); padding: 18px; }
      .modal-title { margin: 0 0 8px; color: var(--brand-dark); font-size: 18px; font-weight: 800; }
      .modal-text { margin: 0 0 12px; color: var(--text); line-height: 1.65; }
      .modal-path { width: 100%; min-height: 54px; margin: 8px 0 12px; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
      .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .main-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
      .url-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
      .action-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
      .action-group { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfc; }
      .action-label { display: block; margin-bottom: 7px; color: var(--brand-dark); font-size: 12px; font-weight: 800; }
      .action-group .actions { grid-template-columns: 1fr; margin: 0; }
      .rakuten-grid { display: grid; grid-template-columns: 170px 1fr auto; gap: 8px; align-items: end; }
      .suggestion-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .suggestion-list button { width: auto; padding: 6px 9px; font-size: 12px; }
      .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 5px; }
      .field-head label { margin: 0; }
      .copy-button { padding: 5px 9px; color: var(--brand-dark); background: #d9f2e5; border-color: #8bcfac; font-size: 12px; }
      .candidate-list { display: grid; gap: 7px; max-height: calc(100vh - 260px); overflow: auto; padding-right: 2px; }
      .candidate { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 9px; }
      .candidate:hover { border-color: var(--brand); background: var(--soft); }
      .candidate.sent { color: #777; background: #eeeeee; }
      .candidate-title { font-weight: 800; line-height: 1.35; }
      .candidate-meta { display: flex; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 12px; }
      .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
      .tab { color: var(--brand-dark); background: var(--soft); border-color: var(--line); }
      .tab.active { color: #fff; background: var(--brand); border-color: var(--brand); }
      .body-preview { min-height: 340px; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
      .check-preview { min-height: 120px; }
      .structure-preview { min-height: 360px; }
      .main-input { min-height: 104px; }
      .notes-input { min-height: 104px; }
      .small-textarea { min-height: 64px; }
      .hidden { display: none; }
      .theme-brown { --brand: #8a5a32; --brand-dark: #5f3b1f; --soft: #f8ead6; --soft-strong: #f1d9b8; }
      .theme-blue { --brand: #2563eb; --brand-dark: #1746a2; --soft: #e5f1fb; --soft-strong: #d8e9fb; }

      @keyframes pulseStatus { 0% { opacity: 0.82; } 50% { opacity: 1; } 100% { opacity: 0.82; } }
      @keyframes progressMove { 0% { transform: translateX(-130%); } 50% { transform: translateX(85%); } 100% { transform: translateX(250%); } }
      @media (max-width: 980px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { position: static; min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        .candidate-list { max-height: 360px; }
        .actions { grid-template-columns: 1fr 1fr; }
        .action-groups { grid-template-columns: 1fr; }
        .main-grid, .url-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>

    <script>
      const fields = ['row','mainInput','volume','affiliateName','affiliateUrl','affiliateNotes','competitorUrl1','competitorUrl2','competitorUrl3','readerMindMemo','status','generationModel','body','titleIdeas','tags','metaDescription','permalink','factCheckPoints','structureMemo','wpPostId','wpEditUrl','wpDraftedAt'];
      let appConfigs = [];
      let articleProviders = [];
      let readerMindProviders = [];
      let activeButton = null;
      let activeButtonText = '';
      let autoSaveTimer = null;
      let autoSavePending = false;
      let autoSaveInFlight = false;
      let isFillingForm = false;
      let loadedAppType = '';
      let trefaiPollTimer = null;
      let trefaiPollCount = 0;

      function init() {
        bindAutoSaveControls();
        setBusy('繧｢繝励Μ繧定ｪｭ縺ｿ霎ｼ縺ｿ荳ｭ...');
        google.script.run.withSuccessHandler(function(data) {
          clearBusy();
          appConfigs = data.appConfigs || [];
          articleProviders = data.articleProviders || [];
          readerMindProviders = data.readerMindProviders || [];
          fillSelect('appType', appConfigs.map(function(item) { return { value: item.label, label: item.label }; }), appConfigs[0] && appConfigs[0].label);
          fillSelect('articleProvider', articleProviders, data.selectedArticleProvider || 'openai');
          fillSelect('readerMindProvider', readerMindProviders, data.selectedReaderMindProvider || 'gemini');
          applyTheme();
          setProgress('done');
          setNotice('蛟呵｣懊す繝ｼ繝医ｒ髢九￥縺九∬｡檎分蜿ｷ縺ｧ險倅ｺ玖｡後ｒ蜻ｼ縺ｳ蜃ｺ縺励※縺上□縺輔＞縲・, false);
        }).withFailureHandler(fail).uaGetWebAppBootData();
      }

      function fillSelect(id, options, selectedValue) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        (options || []).forEach(function(item) {
          const option = document.createElement('option');
          option.value = item.value;
          option.textContent = item.label;
          if (item.value === selectedValue) option.selected = true;
          select.appendChild(option);
        });
      }

      function onAppTypeChange() {
        applyTheme();

      function stripHtmlForImagePrompt(html) {
        const box = document.createElement('div');
        box.innerHTML = String(html || '');
        return (box.textContent || box.innerText || '')
          .replace(/\s+/g, ' ')
          .trim();

      function isImageTargetHeading(heading) {
        const text = String(heading || '').trim();
        if (!text) return false;
        if (/よくある質問|FAQ|まとめ|結論|導入|この記事のポイント/.test(text)) return false;
        return true;
      }

      function rankImageSection(heading, text) {
        const source = String(heading || '') + ' ' + String(text || '');
        let score = 0;
        if (/比較|違い|手順|流れ|原因|対策|理由|判断|基準|選び方|費用|料金|工賃|注意|チェック|ポイント|メリット|デメリット/.test(source)) score += 5;
        if (/表|一覧|3つ|4つ|5つ|7つ|ステップ|パターン|ケース/.test(source)) score += 3;
        if (/安全|保証|法規|車検|失敗|後悔|リスク/.test(source)) score += 2;
        return score;
      }

      function buildImageGenerationItems(title, body) {
        const items = [];
        const baseTitle = title || 'ブログ記事';
        const bodyText = stripHtmlForImagePrompt(body);
        items.push({
          title: baseTitle,
          body: [
            '画像タイプ: EYECATCH',
            '記事全体を代表するアイキャッチ。本文画像とは構図を変える。',
            bodyText.slice(0, 5000)
          ].join('\n'),
          imageType: 'EYECATCH'
        });

        const sections = [];
        const h2Re = /<h2[^>]*>([\s\S]*?)<\/h2>/gi;
        let match;
        while ((match = h2Re.exec(String(body || ''))) !== null) {
          const heading = stripHtmlForImagePrompt(match[1]);
          if (!isImageTargetHeading(heading)) continue;
          sections.push({ heading: heading, index: match.index });
        }

        const candidates = sections.map(function(section, index) {
          const next = sections[index + 1];
          const chunk = String(body || '').slice(section.index, next ? next.index : undefined);
          const chunkText = stripHtmlForImagePrompt(chunk);
          return {
            heading: section.heading,
            text: chunkText,
            score: rankImageSection(section.heading, chunkText),
            order: index
          };
        }).filter(function(item) {
          return item.text.length >= 80;
        });

        candidates.sort(function(a, b) {
          if (b.score !== a.score) return b.score - a.score;
          return a.order - b.order;
        });

        candidates.slice(0, 5).forEach(function(item, index) {
          items.push({
            title: baseTitle + '｜' + item.heading,
            body: [
              '画像タイプ: H2-' + String(index + 1).padStart(2, '0'),
              '対象H2: ' + item.heading,
              'この記事内の他画像と同じ構図は禁止。アイキャッチとも構図を変える。',
              '本文理解を補助する図解・比較・手順・判断軸の画像にする。',
              item.text.slice(0, 3500)
            ].join('\n'),
            imageType: 'H2-' + String(index + 1).padStart(2, '0')
          });
        });
        return items;
      }

      async function sendToOpalImageGenerator(button) {
        const data = readForm();
        const title = pickFirstTitleIdea() || data.mainInput || '';
        const body = data.body || '';
        if (!title && !body) {
          setNotice('タイトル候補または本文がありません。本文生成後に実行してください。', true);
          return;
        }
        setBusy('ChatGPTへ画像生成リクエストを送信中...', button);
        try {
          const baseUrl = await findLocalOpalBaseUrl();
          if (!baseUrl) {
            clearBusy();
            setProgress('error');
            setNotice('ローカル画像生成アプリが起動していません。デスクトップの「ChatGPT画像生成フォーム」を起動してから、もう一度押してください。', true);
            return;
          }
          const items = buildImageGenerationItems(title, body);
          const res = await fetch(baseUrl + '/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              targetTool: 'chatgpt',
              title: title,
              body: body,
              style: '',
              items: items
            })
          });
          const result = await res.json();
          clearBusy();
          if (!result || !result.ok) {
            setProgress('error');
            setNotice(result && result.message ? result.message : 'ChatGPTへの画像生成リクエスト送信に失敗しました。', true);
            return;
          }
          setProgress('done');
          setNotice(result.message || ('ChatGPTへ' + items.length + '件の画像生成リクエストを送りました。'), false);
        } catch (e) {
          clearBusy();
          setProgress('error');
          setNotice('ChatGPT画像生成送信でエラーが出ました: ' + (e && e.message ? e.message : e), true);
        }
      }

          showTab('check');
          setProgress('done');
          setNotice(data.message || '險倅ｺ区ｧ区・繧剃ｽ懈・縺励∪縺励◆縲・, false);
          if (isTrefaiQueuedMessage(data && data.message)) {
            startTrefaiPolling(data);
          }
        }).withFailureHandler(function(error) {
          clearTimeout(slowTimer);
          fail(error);
        }).uaRunArticleStructureFromWeb(readForm());
      }

      function isTrefaiQueuedMessage(message) {
        return String(message || '').indexOf('繝医Ξ繝輔ぃ繧､縺ｸ荳贋ｽ攻RL蜿門ｾ励ｒ萓晞ｼ縺励∪縺励◆') !== -1;
      }

      function startTrefaiPolling(data) {
        stopTrefaiPolling();
        trefaiPollCount = 0;
        showTrefaiDialog();
        setNotice('繝医Ξ繝輔ぃ繧､縺ｧ荳贋ｽ攻RL蜿門ｾ嶺ｸｭ縺ｧ縺吶ょｮ御ｺ・＠縺溘ｉ縺薙・逕ｻ髱｢縺ｫ閾ｪ蜍募渚譏縺励∪縺吶るｻ偵＞逕ｻ髱｢縺ｯ髢峨§縺壹↓縺雁ｾ・■縺上□縺輔＞縲・, false);
        document.getElementById('notice').className = 'status working';
        setProgress('loading');
        trefaiPollTimer = setInterval(function() {
          trefaiPollCount++;
          refreshCurrentArticleAfterTrefai(data);
          if (trefaiPollCount >= 20) {
            stopTrefaiPolling();
            setProgress('error');
            setNotice('繝医Ξ繝輔ぃ繧､螳御ｺ・ｾ・■縺碁聞蠑輔＞縺ｦ縺・∪縺吶・rticleBridge.exe 縺ｮ鮟偵＞逕ｻ髱｢縺ｫ繧ｨ繝ｩ繝ｼ縺悟・縺ｦ縺・↑縺・°遒ｺ隱阪＠縺ｦ縺上□縺輔＞縲・, true);
          }
        }, 10000);
      }

      function stopTrefaiPolling() {
        if (trefaiPollTimer) {
          clearInterval(trefaiPollTimer);
          trefaiPollTimer = null;
        }
      }

      function refreshCurrentArticleAfterTrefai(originalData) {
        const appType = (originalData && originalData.appType) || document.getElementById('appType').value;
        const row = (originalData && originalData.row) || document.getElementById('row').value;
        if (!appType || !row) return;

        google.script.run.withSuccessHandler(function(nextData) {
          fillForm(nextData);
          showTab('check');

          if (String(nextData && nextData.structureMemo || '').trim()) {
            stopTrefaiPolling();
            setProgress('done');
            setNotice('繝医Ξ繝輔ぃ繧､URL繧剃ｽｿ縺｣縺滓ｧ区・繝｡繝｢繧貞渚譏縺励∪縺励◆縲・, false);
          } else {
            setNotice('繝医Ξ繝輔ぃ繧､蜃ｦ逅・ｾ・■縺ｧ縺吶ょｮ御ｺ・＠縺溘ｉ閾ｪ蜍募渚譏縺励∪縺吶・, false);
            document.getElementById('notice').className = 'status working';
            setProgress('loading');
          }
        }).withFailureHandler(function(error) {
          stopTrefaiPolling();
          fail(error);
        }).uaGetArticleRowForWeb(appType, row);
      }

      function showTrefaiDialog() {
        const dialog = document.getElementById('trefaiDialog');
        if (dialog) dialog.classList.remove('hidden');
      }

      function closeTrefaiDialog() {
        const dialog = document.getElementById('trefaiDialog');
        if (dialog) dialog.classList.add('hidden');
      }

      function launchTrefaiOnce() {
        window.location.href = 'articlebridge://run';
        closeTrefaiDialog();
        setNotice('繝医Ξ繝輔ぃ繧､繧・蝗槭□縺題ｵｷ蜍輔＠縺ｾ縺励◆縲ゅヶ繝ｩ繧ｦ繧ｶ縺ｮ遒ｺ隱阪′蜃ｺ縺溘ｉ險ｱ蜿ｯ縺励※縺上□縺輔＞縲ょｮ御ｺ・ｾ後↓閾ｪ蜍募渚譏縺励∪縺吶・, false);
        document.getElementById('notice').className = 'status working';
        setProgress('loading');
      }

      function copyTrefaiRunPath() {
        const field = document.getElementById('trefaiRunPath');
        if (!field) return;
        field.focus();
        field.select();
        try {
          document.execCommand('copy');
          setNotice('繝医Ξ繝輔ぃ繧､襍ｷ蜍輔ヵ繧｡繧､繝ｫ縺ｮ繝代せ繧偵さ繝斐・縺励∪縺励◆縲ゅお繧ｯ繧ｹ繝励Ο繝ｼ繝ｩ繝ｼ縺妓in+R縺ｫ雋ｼ繧贋ｻ倥￠縺ｦ螳溯｡後〒縺阪∪縺吶・, false);
        } catch (e) {
          setNotice('繧ｳ繝斐・縺ｧ縺阪∪縺帙ｓ縺ｧ縺励◆縲ゅヱ繧ｹ繧帝∈謚槭＠縺ｦ謇句虚繧ｳ繝斐・縺励※縺上□縺輔＞縲・, true);
        }
      }

      function addRakutenBanner(button) {

        }).withFailureHandler(fail).uaAddRakutenBannerFromWeb(readForm());

      function addWpImages(button) {

      function createWpDraft(button) {
        setBusy('WordPress荳区嶌縺堺ｽ懈・荳ｭ...', button);

      function saveProviders() {
        setBusy('菴ｿ逕ｨAPI繧呈峩譁ｰ荳ｭ...');
        google.script.run.withSuccessHandler(function(result) {
          clearBusy();
          setProgress('done');
          setNotice(result.message || '菴ｿ逕ｨAPI繧呈峩譁ｰ縺励∪縺励◆縲・, false);
        }).withFailureHandler(fail).uaSetProvidersFromPanel(document.getElementById('articleProvider').value, document.getElementById('readerMindProvider').value);
      }

      function showTab(name) {
        ['summary', 'body', 'check'].forEach(function(tab) {
          document.getElementById('panel' + capitalize(tab)).classList.toggle('hidden', tab !== name);
          document.getElementById('tab' + capitalize(tab)).classList.toggle('active', tab === name);
        });
      }

      function capitalize(value) { return value.charAt(0).toUpperCase() + value.slice(1); }

      function copyField(id, label) {
        const el = document.getElementById(id);
        const text = el ? el.value : '';
        if (!text) { setNotice((label || '鬆・岼') + '縺ｯ遨ｺ縺ｧ縺吶・, true); return; }
        navigator.clipboard.writeText(text).then(function() {
          setNotice((label || '鬆・岼') + '繧偵さ繝斐・縺励∪縺励◆縲・, false);
        }).catch(function() {
          const temp = document.createElement('textarea');
          temp.value = text;
          temp.style.position = 'fixed';
          temp.style.left = '-9999px';
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          setNotice((label || '鬆・岼') + '繧偵さ繝斐・縺励∪縺励◆縲・, false);
        });
      }

      function setNotice(message, isError) {
        const notice = document.getElementById('notice');
        notice.textContent = message;
        notice.className = isError ? 'status error' : 'status';
      }

      function setBusy(message, button) {
        setNotice(message, false);
        document.getElementById('notice').className = 'status working';
        setProgress('loading');
        activeButton = button || null;
        activeButtonText = activeButton ? activeButton.textContent : '';
        document.querySelectorAll('button').forEach(function(item) { item.disabled = true; });
        if (activeButton) activeButton.textContent = message;
      }

      function clearBusy() {
        document.querySelectorAll('button').forEach(function(item) { item.disabled = false; });
        if (activeButton) activeButton.textContent = activeButtonText;
        activeButton = null;
        activeButtonText = '';
        if (autoSavePending) scheduleAutoSave();
      }

      function setProgress(state) {
        const bar = document.getElementById('progressBar');
        bar.className = 'progress-bar';
        bar.style.background = 'var(--brand)';
        if (state === 'loading') { bar.classList.add('loading'); bar.style.width = '38%'; return; }
        if (state === 'done') { bar.style.width = '100%'; return; }
        if (state === 'error') { bar.style.width = '100%'; bar.style.background = 'var(--danger)'; return; }
        bar.style.width = '0%';
      }

      function fail(error) {
        clearBusy();
        setProgress('error');
        setNotice('蜃ｦ逅・↓螟ｱ謨励＠縺ｾ縺励◆: ' + (error && error.message ? error.message : error), true);
      }

      init();
    </script>
