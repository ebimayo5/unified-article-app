<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --bg: #f6f7f8;
        --panel: #ffffff;
        --line: #dfe3e7;
        --text: #1f2933;
        --muted: #667085;
        --brand: #176b5d;
        --brand-dark: #0f5146;
        --soft: #eef6f4;
        --danger: #b42318;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        font-size: 13px;
      }

      .app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 0 0 10px;
        margin-bottom: 12px;
        background: var(--bg);
      }

      .title {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 800;
      }

      .sub {
        color: var(--muted);
        line-height: 1.5;
      }

      .section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }

      .wide-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-items: start;
      }

      h2 {
        color: var(--brand-dark);
        font-size: 15px;
        font-weight: 800;
        margin: 0 0 10px;
        padding: 0 0 7px;
        border-bottom: 2px solid var(--soft);
      }

      label {
        display: block;
        color: #344054;
        font-size: 14px;
        font-weight: 700;
        margin: 10px 0 5px;
      }

      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cfd6dd;
        border-radius: 6px;
        padding: 8px;
        font: inherit;
        background: #fff;
        color: var(--text);
      }

      textarea {
        min-height: 72px;
        resize: vertical;
        line-height: 1.45;
      }

      .memo {
        min-height: 170px;
      }

      .body-preview {
        min-height: 220px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
      }

      .check-preview {
        min-height: 110px;
      }

      .structure-preview {
        min-height: 260px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .rakuten-grid {
        display: grid;
        grid-template-columns: 180px 1fr auto;
        gap: 8px;
        align-items: end;
      }

      .suggestion-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .suggestion-list button {
        width: auto;
        padding: 6px 9px;
        font-size: 12px;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        margin: 12px 0;
      }

      .action-groups {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 12px 0;
      }

      .action-group {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfdfc;
      }

      .action-label {
        display: block;
        margin-bottom: 7px;
        color: var(--brand-dark);
        font-size: 12px;
        font-weight: 800;
      }

      .action-group .actions {
        grid-template-columns: 1fr;
        margin: 0;
      }

      button {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        color: #fff;
        background: var(--brand);
      }

      button.secondary {
        color: var(--brand-dark);
        background: #e4f4ef;
        border-color: #95cfc2;
      }

      button.neutral {
        color: var(--brand-dark);
        background: #f3faf7;
        border-color: #badbd2;
      }

      button:disabled {
        cursor: default;
        opacity: 0.62;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-bottom: 8px;
      }

      .tab {
        padding: 8px 4px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--brand-dark);
        font-weight: 700;
      }

      .tab.active {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 10px 0 5px;
      }

      .field-head label {
        margin: 0;
      }

      button.copy-button {
        width: auto;
        min-width: 76px;
        padding: 5px 9px;
        border-color: #b8ded6;
        background: #f4faf8;
        color: var(--brand-dark);
        font-size: 12px;
      }

      .status {
        min-width: 220px;
        padding: 10px 12px;
        background: var(--soft);
        border: 1px solid #c9e4dd;
        border-radius: 6px;
        color: var(--brand-dark);
        font-size: 15px;
        font-weight: 800;
        line-height: 1.35;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08);
      }

      .status.working {
        color: #fff;
        background: var(--brand);
        border-color: var(--brand);
        animation: pulseStatus 1.1s ease-in-out infinite;
      }

      .progress {
        height: 7px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #dfe7e5;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
        transition: width 0.25s ease;
      }

      .progress-bar.loading {
        width: 38%;
        animation: progressMove 1.2s ease-in-out infinite;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(15, 23, 42, 0.42);
      }

      .modal {
        width: min(560px, 100%);
        border: 1px solid #b8ded6;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
        padding: 18px;
      }

      .modal-title {
        margin: 0 0 8px;
        color: var(--brand-dark);
        font-size: 18px;
        font-weight: 800;
      }

      .modal-text {
        margin: 0 0 12px;
        color: var(--text);
        line-height: 1.65;
      }

      .modal-path {
        width: 100%;
        min-height: 54px;
        margin: 8px 0 12px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
      }

      .modal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .error {
        background: #fff1f0;
        border-color: #fecdca;
        color: var(--danger);
      }

      .hidden {
        display: none;
      }

      .theme-brown {
        --brand: #8a5a32;
        --brand-dark: #5f3b1f;
        --soft: #f8ead6;
      }

      .theme-blue {
        --brand: #2563eb;
        --brand-dark: #1746a2;
        --soft: #e5f1fb;
      }

      @media (max-width: 980px) {
        .action-groups {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @keyframes pulseStatus {
        0% { opacity: 0.82; }
        50% { opacity: 1; }
        100% { opacity: 0.82; }
      }

      @keyframes progressMove {
        0% { transform: translateX(-130%); }
        50% { transform: translateX(85%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <div class="header">
        <div>
          <p class="title">統合版記事作成アプリ</p>
          <div class="sub">スプシは一覧、パネルは編集画面。まずは読み込み・保存の土台です。</div>
        </div>
        <div>
          <div id="notice" class="status">読み込み中...</div>
          <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>
      </div>

      <div class="wide-grid">
        <div class="section">
          <h2>基本情報</h2>
          <div class="row">
            <div>
              <label for="row">行</label>
              <input id="row" readonly>
            </div>
            <div>
              <label for="status">状態</label>
              <input id="status">
            </div>
          </div>

          <label for="appType">記事タイプ</label>
          <select id="appType" onchange="onAppTypeChange()"></select>

          <label id="mainInputLabel" for="mainInput">メインキーワード / 案件指示書</label>
          <textarea id="mainInput"></textarea>

          <label for="volume">検索ボリューム</label>
          <input id="volume">

          <div class="row">
            <div>
              <label for="articleProvider">記事生成API</label>
              <select id="articleProvider" onchange="saveProviders()"></select>
            </div>
            <div>
              <label for="readerMindProvider">読者心理API</label>
              <select id="readerMindProvider" onchange="saveProviders()"></select>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="selectedArticleModel">記事生成モデル</label>
              <input id="selectedArticleModel" readonly>
            </div>
            <div>
              <label for="selectedReaderMindModel">読者心理モデル</label>
              <input id="selectedReaderMindModel" readonly>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>案件・制約</h2>
          <label for="affiliateName">メイン案件名</label>
          <input id="affiliateName">

          <label for="affiliateUrl">メインアフィリエイトURL</label>
          <input id="affiliateUrl" placeholder="https://...">

          <label for="affiliateNotes">案件注意点 / その他制約事項</label>
          <textarea id="affiliateNotes"></textarea>

          <label>楽天バナー</label>
          <div class="rakuten-grid">
            <select id="rakutenBannerMode" onchange="syncRakutenControlsToNotes()">
              <option value="auto">自動判定</option>
              <option value="force">入れる</option>
              <option value="none">入れない</option>
            </select>
            <input id="rakutenProductKeyword" placeholder="例: ランドリーチェスト 防カビ" oninput="syncRakutenControlsToNotes()">
            <button class="secondary" type="button" onclick="suggestRakutenKeywords(this)">候補取得</button>
          </div>
          <div id="rakutenSuggestions" class="suggestion-list"></div>
        </div>
      </div>

      <div class="wide-grid">
        <div class="section">
          <h2>競合URL</h2>
          <label for="competitorUrl1">競合URL1</label>
          <input id="competitorUrl1">
          <label for="competitorUrl2">競合URL2</label>
          <input id="competitorUrl2">
          <label for="competitorUrl3">競合URL3</label>
          <input id="competitorUrl3">
        </div>

        <div class="section">
          <h2>読者心理メモ</h2>
          <div class="field-head">
            <label for="readerMindMemo">読者心理メモ</label>
            <button class="copy-button" type="button" onclick="copyField('readerMindMemo', '読者心理メモ')">コピー</button>
          </div>
          <textarea id="readerMindMemo" class="memo"></textarea>
        </div>
      </div>

      <div class="action-groups">
        <div class="action-group">
          <span class="action-label">候補・保存</span>
          <div class="actions">
            <button class="neutral" onclick="openCandidateSheet(this)">候補シートを開く</button>
            <button class="secondary" onclick="loadSelectedRow(this)">選択行を反映</button>
            <button class="neutral" onclick="saveRow(this)">今すぐ保存</button>
          </div>
        </div>
        <div class="action-group">
          <span class="action-label">生成</span>
          <div class="actions">
            <button class="secondary" onclick="runReaderMind(this)">読者心理メモを取得</button>
            <button class="secondary" onclick="runArticleStructure(this)">記事構成作成</button>
            <button class="primary" onclick="runArticle(this)">記事を書く</button>
          </div>
        </div>
        <div class="action-group">
          <span class="action-label">本文へ後入れ</span>
          <div class="actions">
            <button class="secondary" onclick="addRakutenBanner(this)">楽天バナーを追加</button>
            <button class="secondary" onclick="addInternalLink(this)">内部リンクを追加</button>
            <button class="secondary" onclick="addExternalLink(this)">外部リンクを追加</button>
            <button class="secondary" onclick="sendToOpalImageGenerator(this)">ChatGPTへ画像生成</button>
            <button class="secondary" onclick="addWpImages(this)">画像URLをWPへ追加</button>
          </div>
        </div>
        <div class="action-group">
          <span class="action-label">公開後</span>
          <div class="actions">
            <button class="neutral" onclick="markPosted(this)">投稿済みにする</button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="tabs">
          <button id="tabSummary" class="tab active" onclick="showTab('summary')">概要</button>
          <button id="tabBody" class="tab" onclick="showTab('body')">本文</button>
          <button id="tabCheck" class="tab" onclick="showTab('check')">確認</button>
        </div>

        <div id="panelSummary">
          <div class="field-head">
            <label for="titleIdeas">タイトル案</label>
            <button class="copy-button" type="button" onclick="copyField('titleIdeas', 'タイトル案')">コピー</button>
          </div>
          <textarea id="titleIdeas"></textarea>

          <div class="field-head">
            <label for="metaDescription">メタディスクリプション</label>
            <button class="copy-button" type="button" onclick="copyField('metaDescription', 'メタディスクリプション')">コピー</button>
          </div>
          <textarea id="metaDescription"></textarea>

          <div class="field-head">
            <label for="permalink">パーマリンク</label>
            <button class="copy-button" type="button" onclick="copyField('permalink', 'パーマリンク')">コピー</button>
          </div>
          <input id="permalink">
        </div>

        <div id="panelBody" class="hidden">
          <div class="field-head">
            <label for="body">本文</label>
            <button class="copy-button" type="button" onclick="copyField('body', '本文')">コピー</button>
          </div>
          <textarea id="body" class="body-preview"></textarea>
        </div>

        <div id="panelCheck" class="hidden">
          <div class="field-head">
            <label for="factCheckPoints">要確認ポイント</label>
            <button class="copy-button" type="button" onclick="copyField('factCheckPoints', '要確認ポイント')">コピー</button>
          </div>
          <textarea id="factCheckPoints" class="body-preview check-preview"></textarea>

          <div class="field-head">
            <label for="structureMemo">構成メモ</label>
            <button class="copy-button" type="button" onclick="copyField('structureMemo', '構成メモ')">コピー</button>
            <button class="copy-button" type="button" onclick="appendImageUrlTemplate()">画像URLひな形</button>
          </div>
          <textarea id="structureMemo" class="body-preview structure-preview"></textarea>

          <div class="field-head">
            <label for="tags">関連タグ</label>
            <button class="copy-button" type="button" onclick="copyField('tags', 'タグ')">コピー</button>
          </div>
          <textarea id="tags"></textarea>
        </div>
      </div>
    </div>

    <div id="trefaiDialog" class="modal-backdrop hidden">
      <div class="modal">
        <p class="modal-title">トレファイを1回だけ起動</p>
        <p class="modal-text">記事構成の依頼を作成しました。トレファイを起動しますか？処理後は自動で終了します。</p>
        <textarea id="trefaiRunPath" class="modal-path hidden" readonly>C:\Users\ebima\Documents\Codex\2026-06-14\files-mentioned-by-the-user-codex\outputs\keyword_research_app\dist\ArticleBridge_1回だけ実行.bat</textarea>
        <div class="modal-actions">
          <button class="secondary" type="button" onclick="copyTrefaiRunPath()">うまく開かない時はパスをコピー</button>
          <button class="neutral" type="button" onclick="closeTrefaiDialog()">あとで</button>
          <button class="primary" type="button" onclick="launchTrefaiOnce()">トレファイを起動</button>
        </div>
      </div>
    </div>

    <script>
      const fields = [
        'row', 'appType', 'mainInput', 'volume', 'affiliateName', 'affiliateUrl',
        'affiliateNotes', 'competitorUrl1', 'competitorUrl2', 'competitorUrl3',
        'readerMindMemo', 'status', 'createdAt', 'generationModel',
        'selectedArticleModel', 'selectedReaderMindModel', 'body', 'titleIdeas',
        'tags', 'metaDescription', 'permalink', 'factCheckPoints', 'structureMemo'
      ];

      let appConfigs = [];
      let articleProviders = [];
      let readerMindProviders = [];
      let activeButton = null;
      let activeButtonText = '';
      let autoSaveTimer = null;
      let autoSavePending = false;
      let autoSaveInFlight = false;
      let isFillingForm = false;
      let loadedAppType = '';
      let trefaiPollTimer = null;
      let trefaiPollCount = 0;

      function init() {
        bindAutoSaveControls();
        google.script.run
          .withSuccessHandler(function(options) {
            options = options || {};
            appConfigs = options.appConfigs || [];
            articleProviders = options.articleProviders || [];
            readerMindProviders = options.readerMindProviders || [];
            populateAppTypes();
            populateProviders(options.selectedArticleProvider, options.selectedReaderMindProvider);
            loadInitialRow();
          })
          .withFailureHandler(fail)
          .uaGetPanelOptions();
      }

      function populateAppTypes() {
        const select = document.getElementById('appType');
        select.innerHTML = '';
        appConfigs.forEach(function(config) {
          const option = document.createElement('option');
          option.value = config.label;
          option.textContent = config.label;
          select.appendChild(option);
        });
      }

      function populateProviders(selectedArticleProvider, selectedReaderMindProvider) {
        fillSelect('articleProvider', articleProviders, selectedArticleProvider || 'openai');
        fillSelect('readerMindProvider', readerMindProviders, selectedReaderMindProvider || 'gemini');
      }

      function fillSelect(id, options, selectedValue) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        (options || []).forEach(function(optionItem) {
          const option = document.createElement('option');
          option.value = optionItem.value;
          option.textContent = optionItem.label;
          if (optionItem.value === selectedValue) option.selected = true;
          select.appendChild(option);
        });
      }

      function readForm() {
        syncRakutenControlsToNotes();
        const data = {};
        fields.forEach(function(id) {
          const el = document.getElementById(id);
          if (el) data[id] = el.value;
        });
        return data;
      }

      function fillForm(data) {
        isFillingForm = true;
        fields.forEach(function(id) {
          const el = document.getElementById(id);
          if (!el) return;
          el.value = data && data[id] ? data[id] : '';
        });
        applyTheme();
        parseRakutenControlsFromNotes();
        loadedAppType = data && data.appType ? data.appType : '';
        setNotice('選択行を読み込みました。', false);
        isFillingForm = false;
      }

      function bindAutoSaveControls() {
        document.querySelectorAll('input, textarea, select').forEach(function(el) {
          if (!el.id) return;
          if (el.id === 'appType' || el.id === 'articleProvider' || el.id === 'readerMindProvider') return;
          el.addEventListener('input', scheduleAutoSave);
          el.addEventListener('change', scheduleAutoSave);
        });
      }

      function onAppTypeChange() {
        applyTheme();
        if (loadedAppType && document.getElementById('appType').value !== loadedAppType) {
          clearLoadedArticleForm();
          setNotice('サイトを切り替えました。候補シートから行を反映してください。', false);
        }
      }

      function clearLoadedArticleForm() {
        isFillingForm = true;
        fields.forEach(function(id) {
          if (id === 'appType') return;
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
        loadedAppType = '';
        document.getElementById('rakutenBannerMode').value = 'auto';
        document.getElementById('rakutenProductKeyword').value = '';
        document.getElementById('rakutenSuggestions').innerHTML = '';
        isFillingForm = false;
      }

      function scheduleAutoSave() {
        if (isFillingForm) return;
        const rowEl = document.getElementById('row');
        if (!rowEl || !rowEl.value || Number(rowEl.value) <= 1) return;
        if (loadedAppType && document.getElementById('appType').value !== loadedAppType) return;
        autoSavePending = true;
        window.clearTimeout(autoSaveTimer);
        autoSaveTimer = window.setTimeout(runAutoSave, 900);
      }

      function runAutoSave() {
        if (!autoSavePending || autoSaveInFlight) return;
        if (activeButton) {
          autoSaveTimer = window.setTimeout(runAutoSave, 1200);
          return;
        }

        autoSavePending = false;
        autoSaveInFlight = true;
        setNotice('自動保存中...', false);
        const payload = readForm();
        if (loadedAppType) payload.appType = loadedAppType;
        google.script.run
          .withSuccessHandler(function(data) {
            autoSaveInFlight = false;
            setProgress('done');
            setNotice('自動保存しました。', false);
            if (autoSavePending) scheduleAutoSave();
          })
          .withFailureHandler(function(error) {
            autoSaveInFlight = false;
            setProgress('error');
            setNotice('自動保存に失敗しました: ' + (error && error.message ? error.message : error), true);
          })
          .uaSaveActiveRowData(payload);
      }

      function applyTheme() {
        const selected = document.getElementById('appType').value;
        const config = appConfigs.find(function(item) { return item.label === selected; });
        const app = document.getElementById('app');
        app.classList.remove('theme-brown', 'theme-blue');
        if (config && config.theme === 'brown') app.classList.add('theme-brown');
        if (config && config.theme === 'blue') app.classList.add('theme-blue');
        document.getElementById('mainInputLabel').textContent =
          config && config.inputLabel ? config.inputLabel : 'メインキーワード / 案件指示書';
        const isGeneric = config && config.key === 'general';
        const mode = document.getElementById('rakutenBannerMode');
        const keyword = document.getElementById('rakutenProductKeyword');
        if (mode) mode.disabled = isGeneric;
        if (keyword) keyword.disabled = isGeneric;
      }

      function parseRakutenControlsFromNotes() {
        const notes = document.getElementById('affiliateNotes').value || '';
        const mode = document.getElementById('rakutenBannerMode');
        const keyword = document.getElementById('rakutenProductKeyword');
        const keywordMatch = notes.match(/楽天商品(?:キーワード|KW)[:：]\s*([^\n\r]+)/);

        if (mode) {
          mode.value = /楽天バナーなし|楽天なし/.test(notes)
            ? 'none'
            : /楽天バナーあり|楽天あり/.test(notes)
              ? 'force'
              : 'auto';
        }

        if (keyword) keyword.value = keywordMatch && keywordMatch[1] ? keywordMatch[1].trim() : '';
      }

      function syncRakutenControlsToNotes() {
        const notesEl = document.getElementById('affiliateNotes');
        const modeEl = document.getElementById('rakutenBannerMode');
        const keywordEl = document.getElementById('rakutenProductKeyword');
        if (!notesEl || !modeEl || !keywordEl) return;

        let lines = String(notesEl.value || '').split(/\r?\n/).filter(function(line) {
          const trimmed = line.trim();
          return !/^楽天バナー(あり|なし)$/.test(trimmed) &&
            !/^楽天(あり|なし)$/.test(trimmed) &&
            !/^楽天商品(?:キーワード|KW)[:：]/.test(trimmed);
        });

        if (modeEl.value === 'force') lines.push('楽天バナーあり');
        if (modeEl.value === 'none') lines.push('楽天バナーなし');

        const keyword = keywordEl.value.trim();
        if (keyword) lines.push('楽天商品キーワード: ' + keyword);

        notesEl.value = lines.join('\n').trim();
      }

      function pickFirstTitleIdea() {
        const text = document.getElementById('titleIdeas').value || '';
        return text.split(/\s*[\/／]\s*|\n/)[0].trim();

      function extractH2HeadingsFromBody() {
        const body = document.getElementById('body').value || '';
        const headings = [];
        const seen = {};
        const regex = /<h2\b[^>]*>([\s\S]*?)<\/h2>/gi;
        let match;
        while ((match = regex.exec(body)) !== null) {
          const heading = String(match[1] || '')
            .replace(/<[^>]+>/g, '')
            .replace(/&nbsp;/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/\s+/g, ' ')
            .trim();
          if (!heading || seen[heading]) continue;
          if (/よくある質問|FAQ|まとめ/.test(heading)) continue;
          seen[heading] = true;
          headings.push(heading);
          if (headings.length >= 5) break;
        }
        return headings;
      }

      function appendImageUrlTemplate() {
        const field = document.getElementById('structureMemo');
        if (!field) return;
        const current = field.value || '';
        if (/【画像URLメモ】/.test(current)) {
          setNotice('構成メモには、すでに画像URLメモがあります。', false);
          return;
        }
        const headings = extractH2HeadingsFromBody();
        const lines = [
          '【画像URLメモ】',
          'アイキャッチ: https://'
        ];
        headings.forEach(function(heading) {
          lines.push('H2: ' + heading + ' | https://');
        });
        field.value = [current.trim(), lines.join('\n')].filter(Boolean).join('\n\n');
        setNotice('画像URLメモのひな形を構成メモに追加しました。', false);
      }

      async function findLocalOpalBaseUrl() {
        for (let port = 8765; port <= 8799; port++) {
          const baseUrl = 'http://127.0.0.1:' + port;
          try {
            const res = await fetch(baseUrl + '/health', { method: 'GET', cache: 'no-store' });
            if (res.ok) return baseUrl;
          } catch (e) {
            // Try next local port.
          }
        }
        return '';
      }

      async function sendToOpalImageGenerator(button) {
        const data = readForm();
        const title = pickFirstTitleIdea() || data.mainInput || '';
        const body = data.body || '';
        if (!title && !body) {
          setNotice('タイトル候補または本文がありません。本文生成後に実行してください。', true);
          return;
        }
        setBusy('ChatGPTへ画像生成リクエストを送信中...', button);
        try {
          const baseUrl = await findLocalOpalBaseUrl();
          if (!baseUrl) {
            clearBusy();
            setProgress('error');
            setNotice('ChatGPT画像生成フォームが起動していません。起動用ショートカットからフォームを開いてから、もう一度押してください。', true);
            return;
          }
          const res = await fetch(baseUrl + '/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, body: body, style: '' })
          });
          const result = await res.json();
          clearBusy();
          if (!result || !result.ok) {
            setProgress('error');
            setNotice(result && result.message ? result.message : 'ChatGPTへの画像生成リクエスト送信に失敗しました。', true);
            return;
          }
          setProgress('done');
          setNotice(result.message || 'ChatGPTへ画像生成リクエストを送信しました。', false);
        } catch (e) {
          clearBusy();
          setProgress('error');
          setNotice('ChatGPT画像生成送信でエラーが出ました: ' + (e && e.message ? e.message : e), true);
        }
      }

      function startTrefaiPolling(data) {
        stopTrefaiPolling();

        setProgress('loading');
        trefaiPollTimer = setInterval(function() {
          trefaiPollCount++;
          refreshCurrentArticleAfterTrefai(data);
          if (trefaiPollCount >= 20) {
            stopTrefaiPolling();
            setProgress('error');
            setNotice('トレファイ完了待ちが長引いています。ArticleBridge.exe の黒い画面にエラーが出ていないか確認してください。', true);
          }

      function copyField(id, label) {
        const el = document.getElementById(id);
        if (!el) return;
        const text = el.value || '';
        if (!text) {
          setNotice((label || '項目') + 'は空です。', true);
          return;
        }

        if (!navigator.clipboard || !navigator.clipboard.writeText) {
          fallbackCopy(text, label);
          return;
        }

        navigator.clipboard.writeText(text).then(function() {
          setNotice((label || '項目') + 'をコピーしました。', false);
        }).catch(function() {
          fallbackCopy(text, label);
        });
      }

      function fallbackCopy(text, label) {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.focus();
        temp.select();

        try {
          document.execCommand('copy');
          setNotice((label || '項目') + 'をコピーしました。', false);
        } catch (e) {
          setNotice((label || '項目') + 'のコピーに失敗しました。手動で選択してください。', true);
        }

        document.body.removeChild(temp);
      }

      function showTab(name) {
        ['summary', 'body', 'check'].forEach(function(tab) {
          document.getElementById('panel' + capitalize(tab)).classList.toggle('hidden', tab !== name);
          document.getElementById('tab' + capitalize(tab)).classList.toggle('active', tab === name);
        });
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function setNotice(message, isError) {
        const notice = document.getElementById('notice');
        notice.textContent = message;
        notice.className = isError ? 'status error' : 'status';
      }

      function setProgress(state) {
        const bar = document.getElementById('progressBar');
        bar.className = 'progress-bar';
        bar.style.background = 'var(--brand)';
        if (state === 'loading') { bar.classList.add('loading'); bar.style.width = '38%'; return; }
        if (state === 'done') { bar.style.width = '100%'; return; }
        if (state === 'error') { bar.style.width = '100%'; bar.style.background = 'var(--danger)'; return; }
        bar.style.width = '0%';
      }

      function setBusy(message, button) {
        const notice = document.getElementById('notice');
        notice.textContent = message;
        notice.className = 'status working';
        setProgress('loading');
        activeButton = button || null;
        activeButtonText = activeButton ? activeButton.textContent : '';
        document.querySelectorAll('button').forEach(function(item) { item.disabled = true; });
        if (activeButton) activeButton.textContent = message;
      }

      function clearBusy() {
        document.querySelectorAll('button').forEach(function(item) { item.disabled = false; });
        if (activeButton) activeButton.textContent = activeButtonText;
        activeButton = null;
        activeButtonText = '';
        if (autoSavePending) scheduleAutoSave();
      }

      function fail(error) {
        clearBusy();
        setProgress('error');
        setNotice('処理に失敗しました: ' + (error && error.message ? error.message : error), true);
      }
